name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Check signing secret
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::GitHub Secrets에 KEYSTORE_PASSWORD가 없습니다"
            exit 1
          fi

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E -A3 "^e: |What went wrong" build.log | grep -v "^> Task" | grep -v "^--$" | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MoodWords.apk

      # 폰에서 바로 받기 쉽도록 Releases에 올림
      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 감정단어 빌드 ${{ github.run_number }}
          body: 워치에 설치할 APK입니다. 아래 MoodWords.apk를 받으세요.
          files: MoodWords.apk
