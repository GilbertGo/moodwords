name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v5

      - name: Check signing secret
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::GitHub Secrets에 KEYSTORE_PASSWORD가 없습니다"
            exit 1
          fi

      - name: Build signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log || {
            grep -E -A3 "^e: |What went wrong" build.log | grep -v "^> Task" | grep -v "^--$" | head -9 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk MoodWords.apk
          cp phone/build/outputs/apk/release/phone-release.apk MoodWords-phone.apk

      # 바뀐 점: 이번 커밋 메시지 (앱의 '새 버전이 있어요' 창에 '- ' 항목이 표시됨)
      - name: Release notes
        run: git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > notes.md

      # 워치용: build-N (최신 릴리스, 기존 워치 앱의 업데이트 확인 대상)
      - name: Publish watch release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 감정단어 워치 v1.${{ github.run_number }}
          body_path: notes.md
          files: MoodWords.apk
          make_latest: true

      # 폰용: phone-N (pre-release라 워치의 '최신 릴리스'를 가리지 않음)
      - name: Publish phone release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: phone-${{ github.run_number }}
          name: 감정단어 폰 v1.${{ github.run_number }}
          body_path: notes.md
          files: MoodWords-phone.apk
          prerelease: true
          make_latest: false
